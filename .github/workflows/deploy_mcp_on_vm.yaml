name: "Deploy MCP Server on GCP VM"

# ============================================================
# Purpose   : Installs FastMCP server on existing postgres-vm
#             as a systemd service behind Nginx with HTTPS.
#
# Pre-req   : VM already resized to e2-medium and running.
#             Workflows 1 + 2 completed (PostgreSQL running).
#             mcp-server/main.py exists in repo root.
#
# Architecture:
#   Claude Code (laptop)
#     ↓ HTTPS port 443 (self-signed cert, rejectUnauthorized:false)
#   Nginx on postgres-vm
#     ↓ HTTP localhost:8000
#   FastMCP server (systemd, stateful sessions)
#     ↓ psycopg2 localhost:5432
#   PostgreSQL (same VM)
#
# Secrets required (all existing):
#   GCP_PROJECT_ID / GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT
#   POSTGRES_PASSWORD / MCP_BEARER_TOKEN
# ============================================================

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: "VM instance name"
        required: true
        default: "postgres-vm"
        type: string
      zone:
        description: "GCP zone"
        required: true
        default: "us-central1-a"
        type: choice
        options:
          - us-central1-a
          - us-central1-b
          - us-east1-b
          - us-west1-a
      mcp_port:
        description: "Internal port FastMCP listens on"
        required: true
        default: "8000"
        type: string
      pg_db:
        description: "PostgreSQL database name"
        required: true
        default: "appdb"
        type: string
      pg_user:
        description: "PostgreSQL user"
        required: true
        default: "appuser"
        type: string

jobs:
  deploy-mcp-on-vm:
    name: "MCP Server → ${{ inputs.vm_name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"

      # --------------------------------------------------------
      # Pre-flight
      # --------------------------------------------------------
      - name: Verify VM is Running
        run: |
          STATUS=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(status)' 2>/dev/null || echo "NOT_FOUND")
          if [[ "$STATUS" != "RUNNING" ]]; then
            echo "VM is $STATUS — must be RUNNING"
            exit 1
          fi
          MACHINE=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(machineType)' | awk -F/ '{print $NF}')
          echo "VM ${{ inputs.vm_name }} is RUNNING on $MACHINE"

      # --------------------------------------------------------
      # Step 1: Open port 443
      # --------------------------------------------------------
      - name: Open Port 443 in Firewall
        run: |
          RULE_NAME="allow-https-443"
          if gcloud compute firewall-rules describe ${RULE_NAME} --quiet 2>/dev/null; then
            echo "Firewall rule ${RULE_NAME} already exists"
          else
            gcloud compute firewall-rules create ${RULE_NAME} \
              --allow tcp:443 \
              --target-tags mcp-server \
              --source-ranges 0.0.0.0/0 \
              --description "Allow HTTPS access to MCP server"
            echo "Port 443 opened"
          fi
          EXISTING_TAGS=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(tags.items)')
          if echo "$EXISTING_TAGS" | grep -q "mcp-server"; then
            echo "mcp-server tag already present"
          else
            gcloud compute instances add-tags ${{ inputs.vm_name }} \
              --zone ${{ inputs.zone }} \
              --tags mcp-server
            echo "mcp-server tag added"
          fi

      # --------------------------------------------------------
      # Step 2: Install Python 3.11 and FastMCP
      # --------------------------------------------------------
      - name: Install Python and FastMCP
        run: |
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e
              while sudo fuser /var/lib/dpkg/lock-frontend 2>/dev/null; do sleep 5; done
              sudo apt-get update -qq
              sudo apt-get install -y python3.11 python3.11-venv python3-pip
              sudo useradd -r -s /usr/sbin/nologin mcpserver 2>/dev/null || true
              sudo mkdir -p /opt/mcp-server /var/log/mcp-server
              sudo chown mcpserver:mcpserver /opt/mcp-server /var/log/mcp-server
              sudo -u mcpserver python3.11 -m venv /opt/mcp-server/venv
              sudo -u mcpserver /opt/mcp-server/venv/bin/pip install \
                --quiet --no-cache-dir \
                'mcp[server]>=1.25,<2' \
                'uvicorn[standard]==0.32.1' \
                'fastapi==0.115.5' \
                'psycopg2-binary==2.9.10'
              echo 'FastMCP version:' \$(/opt/mcp-server/venv/bin/python -c 'import mcp; print(mcp.__version__)')
            "
          echo "Python and FastMCP installed"

      # --------------------------------------------------------
      # Step 3: Copy MCP server code
      # --------------------------------------------------------
      - name: Copy MCP Server Code
        run: |
          gcloud compute scp mcp-server/main.py \
            ${{ inputs.vm_name }}:/tmp/main.py \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              sudo cp /tmp/main.py /opt/mcp-server/main.py
              sudo chown mcpserver:mcpserver /opt/mcp-server/main.py
              echo 'main.py installed'
            "

      # --------------------------------------------------------
      # Step 4: Write config files locally then scp
      # --------------------------------------------------------
      - name: Write Config Files
        run: |
          MCP_PORT="${{ inputs.mcp_port }}"
          PG_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          MCP_BEARER_TOKEN="${{ secrets.MCP_BEARER_TOKEN }}"
          PG_DB="${{ inputs.pg_db }}"
          PG_USER="${{ inputs.pg_user }}"

          printf 'PG_HOST=localhost\nPG_PORT=5432\nPG_DB=%s\nPG_USER=%s\nPG_PASSWORD=%s\nMCP_BEARER_TOKEN=%s\n' \
            "$PG_DB" "$PG_USER" "$PG_PASSWORD" "$MCP_BEARER_TOKEN" > /tmp/mcp-server.env

          printf '[Unit]\nDescription=Retail FastMCP Server\nAfter=network.target postgresql.service\n\n[Service]\nType=simple\nUser=mcpserver\nGroup=mcpserver\nWorkingDirectory=/opt/mcp-server\nEnvironmentFile=/opt/mcp-server/.env\nExecStart=/opt/mcp-server/venv/bin/uvicorn main:app --host 127.0.0.1 --port %s --workers 1\nRestart=always\nRestartSec=5\nStandardOutput=append:/var/log/mcp-server/mcp.log\nStandardError=append:/var/log/mcp-server/mcp.log\n\n[Install]\nWantedBy=multi-user.target\n' \
            "$MCP_PORT" > /tmp/mcp-server.service

          echo "Config files written"

      - name: Copy and Install Config Files
        run: |
          gcloud compute scp /tmp/mcp-server.env \
            ${{ inputs.vm_name }}:/tmp/mcp-server.env \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap
          gcloud compute scp /tmp/mcp-server.service \
            ${{ inputs.vm_name }}:/tmp/mcp-server.service \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e
              sudo mv /tmp/mcp-server.env /opt/mcp-server/.env
              sudo chmod 600 /opt/mcp-server/.env
              sudo chown mcpserver:mcpserver /opt/mcp-server/.env
              sudo mv /tmp/mcp-server.service /etc/systemd/system/mcp-server.service
              sudo systemctl daemon-reload
              sudo systemctl enable mcp-server
              sudo systemctl restart mcp-server
              sleep 3
              sudo systemctl status mcp-server --no-pager
              echo 'MCP service running'
            "
          echo "MCP systemd service started"

      # --------------------------------------------------------
      # Step 5: Self-signed TLS certificate
      # --------------------------------------------------------
      - name: Generate TLS Certificate
        run: |
          VM_IP=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "Generating self-signed cert for IP: ${VM_IP}"
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e
              sudo mkdir -p /etc/nginx/ssl
              sudo openssl req -x509 -nodes -days 365 \
                -newkey rsa:2048 \
                -keyout /etc/nginx/ssl/mcp-server.key \
                -out    /etc/nginx/ssl/mcp-server.crt \
                -subj '/CN=${VM_IP}/O=RetailMCP/C=US' \
                -addext 'subjectAltName=IP:${VM_IP}'
              sudo chmod 600 /etc/nginx/ssl/mcp-server.key
              echo 'Certificate generated:'
              sudo openssl x509 -noout -subject -dates -in /etc/nginx/ssl/mcp-server.crt
            "
          echo "TLS certificate created"

      # --------------------------------------------------------
      # Step 6: Configure Nginx
      # --------------------------------------------------------
      - name: Configure Nginx
        run: |
          MCP_PORT="${{ inputs.mcp_port }}"
          printf 'server {\n    listen 443 ssl;\n    server_name _;\n    ssl_certificate     /etc/nginx/ssl/mcp-server.crt;\n    ssl_certificate_key /etc/nginx/ssl/mcp-server.key;\n    ssl_protocols       TLSv1.2 TLSv1.3;\n    location / {\n        proxy_pass http://127.0.0.1:%s;\n        proxy_set_header Host $host;\n        proxy_set_header X-Forwarded-Proto https;\n        proxy_read_timeout 300;\n        proxy_connect_timeout 300;\n    }\n}\nserver {\n    listen 80;\n    return 301 https://$host$request_uri;\n}\n' \
            "$MCP_PORT" > /tmp/mcp_nginx.conf

          gcloud compute scp /tmp/mcp_nginx.conf \
            ${{ inputs.vm_name }}:/tmp/mcp_nginx.conf \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap

          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e
              sudo mv /tmp/mcp_nginx.conf /etc/nginx/sites-available/mcp-server
              sudo ln -sf /etc/nginx/sites-available/mcp-server /etc/nginx/sites-enabled/mcp-server
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t
              sudo systemctl restart nginx
              echo 'Nginx running'
            "
          echo "Nginx configured"

      # --------------------------------------------------------
      # Step 7: Smoke test and print connection details
      # --------------------------------------------------------
      - name: Smoke Test
        run: |
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              sleep 3
              HTTP_CODE=\$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/health)
              echo Health check: \${HTTP_CODE}
              if [[ \"\${HTTP_CODE}\" == \"200\" ]]; then
                curl -sk https://localhost/health
                echo ''
                echo 'MCP server is healthy'
              else
                sudo tail -20 /var/log/mcp-server/mcp.log || true
                exit 1
              fi
            "

      - name: Print Connection Summary
        run: |
          VM_IP=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(networkInterfaces[0].accessConfigs[0].natIP)')
          TOKEN="${{ secrets.MCP_BEARER_TOKEN }}"

          echo ""
          echo "=============================================="
          echo "MCP SERVER READY ON VM"
          echo "=============================================="
          echo ""
          echo "Endpoint : https://${VM_IP}/mcp/"
          echo "Health   : https://${VM_IP}/health"
          echo "Protocol : MCP Streamable HTTP (stateful)"
          echo ""
          echo "ADD TO CLAUDE CODE (run on your laptop):"
          echo ""
          echo "claude mcp add-json retail-postgres \\"
          echo "  '{\"type\":\"http\",\"url\":\"https://${VM_IP}/mcp/\",\"headers\":{\"Authorization\":\"Bearer ${TOKEN}\"},\"transportOptions\":{\"rejectUnauthorized\":false}}'"
          echo ""
          echo "Then: claude"
          echo "Then: /mcp   (verify connection)"
          echo ""
          echo "Service management on VM:"
          echo "  sudo systemctl status  mcp-server"
          echo "  sudo systemctl restart mcp-server"
          echo "  sudo tail -f /var/log/mcp-server/mcp.log"
          echo "=============================================="