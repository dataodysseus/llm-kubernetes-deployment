# ============================================================
# Workflow 2: Install & Configure PostgreSQL on a GCP VM
# ============================================================
# Purpose   : Installs PostgreSQL, configures remote access,
#             and creates a blank database + app user.
#             No schemas, tables, or seed data — those are
#             managed separately per environment.
#
# Pre-req   : VM must already exist and be RUNNING.
#             Run Workflow 1 (Provision GCP VM) first.
#
# After this workflow:
#   - Connect via pgAdmin, DBeaver, or psql
#   - Create your schemas, tables, and data manually
#
# Secrets required:
#   - GCP_PROJECT_ID
#   - GCP_WORKLOAD_IDENTITY_PROVIDER
#   - GCP_SERVICE_ACCOUNT
#   - POSTGRES_PASSWORD   ← used for both postgres + app user
#
# Required IAM roles on service account:
#   - Compute Admin
#   - IAP-secured Tunnel User
#   - Service Account User
#   - Compute OS Login
# ============================================================

name: "Install PostgreSQL on GCP VM"

on:
  workflow_dispatch:
    inputs:

      # ----------------------------------------------------------
      # Target VM — must already exist (run Workflow 1 first)
      # ----------------------------------------------------------
      vm_name:
        description: "VM instance name (from Workflow 1 output)"
        required: true
        default: "my-vm"
        type: string

      zone:
        description: "GCP zone where the VM is running"
        required: true
        default: "us-central1-a"
        type: choice
        options:
          - us-central1-a
          - us-central1-b
          - us-east1-b
          - us-east1-c
          - us-west1-a
          - europe-west1-b
          - europe-west2-a
          - asia-east1-a
          - asia-southeast1-a

      # ----------------------------------------------------------
      # PostgreSQL version
      # ----------------------------------------------------------
      pg_version:
        description: "PostgreSQL major version to install"
        required: true
        default: "15"
        type: choice
        options:
          - "16"   # latest
          - "15"   # stable, recommended
          - "14"   # LTS fallback

      # ----------------------------------------------------------
      # Database & app user
      # Creates a blank database and a dedicated non-superuser.
      # Connect with these credentials from your client tool.
      # ----------------------------------------------------------
      db_name:
        description: "Blank database name to create"
        required: true
        default: "appdb"
        type: string

      db_user:
        description: "App user to create (non-superuser, owns the database)"
        required: true
        default: "appuser"
        type: string

      # ----------------------------------------------------------
      # Network access
      # ----------------------------------------------------------
      allowed_cidr:
        description: "CIDR allowed to connect on port 5432 (restrict after setup)"
        required: true
        default: "0.0.0.0/0"
        type: string

jobs:
  install-postgres:
    name: "PostgreSQL ${{ inputs.pg_version }} → ${{ inputs.vm_name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # --------------------------------------------------------
      # Auth
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"

      # --------------------------------------------------------
      # Pre-flight: confirm VM exists and is RUNNING
      # --------------------------------------------------------
      - name: Verify Target VM Exists and is Running
        run: |
          VM_NAME="${{ inputs.vm_name }}"
          ZONE="${{ inputs.zone }}"

          STATUS=$(gcloud compute instances describe ${VM_NAME} \
            --zone ${ZONE} \
            --format 'value(status)' 2>/dev/null || echo "NOT_FOUND")

          if [[ "$STATUS" == "NOT_FOUND" ]]; then
            echo "❌ VM '${VM_NAME}' not found in zone ${ZONE}."
            echo "   Please run Workflow 1 (Provision GCP VM) first."
            exit 1
          fi

          if [[ "$STATUS" != "RUNNING" ]]; then
            echo "❌ VM '${VM_NAME}' exists but is '${STATUS}' — expected RUNNING."
            exit 1
          fi

          echo "✅ VM '${VM_NAME}' is RUNNING in ${ZONE}"

      # --------------------------------------------------------
      # Firewall: open port 5432
      # --------------------------------------------------------
      - name: Create Firewall Rule for PostgreSQL
        run: |
          RULE_NAME="allow-postgres-5432"
          CIDR="${{ inputs.allowed_cidr }}"

          if gcloud compute firewall-rules describe ${RULE_NAME} --quiet 2>/dev/null; then
            echo "ℹ️ Firewall rule '${RULE_NAME}' already exists — skipping."
          else
            echo "🔧 Creating firewall rule (tcp:5432, source: ${CIDR})..."
            gcloud compute firewall-rules create ${RULE_NAME} \
              --allow tcp:5432 \
              --target-tags postgres-server \
              --source-ranges ${CIDR} \
              --description "Allow PostgreSQL remote access"
            echo "✅ Firewall rule created"
          fi

          # Ensure the VM carries the postgres-server network tag
          echo "🏷️ Checking 'postgres-server' network tag on VM..."
          EXISTING_TAGS=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(tags.items)')

          if echo "$EXISTING_TAGS" | grep -q "postgres-server"; then
            echo "ℹ️ Tag already present"
          else
            gcloud compute instances add-tags ${{ inputs.vm_name }} \
              --zone ${{ inputs.zone }} \
              --tags postgres-server
            echo "✅ 'postgres-server' tag added to VM"
          fi

      # --------------------------------------------------------
      # Install PostgreSQL from official PGDG repository
      # --------------------------------------------------------
      - name: Install PostgreSQL ${{ inputs.pg_version }}
        run: |
          PG_VERSION="${{ inputs.pg_version }}"

          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e
              echo '📦 Installing prerequisites...'
              sudo apt-get update -qq
              sudo apt-get install -y curl ca-certificates gnupg

              echo '📦 Adding official PostgreSQL PGDG repository...'
              curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                | sudo gpg --batch --yes --no-tty --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
              echo 'deb http://apt.postgresql.org/pub/repos/apt jammy-pgdg main' \
                | sudo tee /etc/apt/sources.list.d/pgdg.list

              sudo apt-get update -qq
              echo '📦 Installing postgresql-${PG_VERSION}...'
              sudo apt-get install -y postgresql-${PG_VERSION} postgresql-contrib-${PG_VERSION}

              sudo systemctl enable postgresql
              sudo systemctl start postgresql

              echo ''
              echo '✅ PostgreSQL version installed:'
              sudo -u postgres psql -c 'SELECT version();'
            "
          echo "✅ PostgreSQL ${{ inputs.pg_version }} installed and running"

      # --------------------------------------------------------
      # Configure: superuser password + remote access
      # --------------------------------------------------------
      - name: Configure PostgreSQL for Remote Access
        run: |
          DB_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          CIDR="${{ inputs.allowed_cidr }}"

          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e

              echo '🔐 Setting postgres superuser password...'
              sudo -u postgres psql -c \"ALTER USER postgres PASSWORD '${DB_PASSWORD}';\"

              echo '🔧 Setting listen_addresses = * ...'
              PG_CONF=\$(sudo -u postgres psql -t -c 'SHOW config_file;' | xargs)
              sudo sed -i \"s/#listen_addresses = 'localhost'/listen_addresses = '*'/\" \$PG_CONF

              echo '🔧 Adding remote access rule to pg_hba.conf...'
              PG_HBA=\$(sudo -u postgres psql -t -c 'SHOW hba_file;' | xargs)
              echo 'host    all             all             ${CIDR}               scram-sha-256' \
                | sudo tee -a \$PG_HBA

              echo '🔄 Restarting PostgreSQL...'
              sudo systemctl restart postgresql
              echo '✅ Remote access configured'
            "
          echo "✅ PostgreSQL configured for remote access"

      # --------------------------------------------------------
      # Create blank database and dedicated app user
      # --------------------------------------------------------
      # --------------------------------------------------------
      - name: Create Database and App User
        run: |
          DB_NAME="${{ inputs.db_name }}"
          DB_USER="${{ inputs.db_user }}"
          DB_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"

          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e

              echo 'Creating database: ${DB_NAME}...'
              DB_EXISTS=\$(sudo -u postgres psql -tAc \"SELECT 1 FROM pg_database WHERE datname='${DB_NAME}';\" )
              if [[ \"\$DB_EXISTS\" == \"1\" ]]; then
                echo 'Database ${DB_NAME} already exists, skipping.'
              else
                sudo -u postgres createdb ${DB_NAME}
                echo 'Database ${DB_NAME} created.'
              fi

              echo 'Creating app user: ${DB_USER}...'
              USER_EXISTS=\$(sudo -u postgres psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='${DB_USER}';\" )
              if [[ \"\$USER_EXISTS\" == \"1\" ]]; then
                echo 'User ${DB_USER} already exists, skipping.'
              else
                sudo -u postgres psql -c \"CREATE USER ${DB_USER} WITH PASSWORD '${DB_PASSWORD}';\"
                echo 'User ${DB_USER} created.'
              fi

              echo 'Granting privileges...'
              sudo -u postgres psql -c \"GRANT ALL PRIVILEGES ON DATABASE ${DB_NAME} TO ${DB_USER};\"

              echo 'Done. Verifying...'
              sudo -u postgres psql -tAc \"SELECT datname FROM pg_database WHERE datname='${DB_NAME}';\"
              sudo -u postgres psql -tAc \"SELECT rolname FROM pg_roles WHERE rolname='${DB_USER}';\"
            "
          echo "Blank database '${{ inputs.db_name }}' and user '${{ inputs.db_user }}' created"

      # --------------------------------------------------------
      # Final summary
      # --------------------------------------------------------
      - name: Print Connection Summary
        run: |
          VM_NAME="${{ inputs.vm_name }}"
          ZONE="${{ inputs.zone }}"
          DB_NAME="${{ inputs.db_name }}"
          DB_USER="${{ inputs.db_user }}"
          PG_VERSION="${{ inputs.pg_version }}"

          PUBLIC_IP=$(gcloud compute instances describe ${VM_NAME} \
            --zone ${ZONE} \
            --format 'value(networkInterfaces[0].accessConfigs[0].natIP)')

          echo ""
          echo "=============================================="
          echo "🎉 POSTGRESQL SERVER READY"
          echo "=============================================="
          echo ""
          echo "🖥️  VM             : ${VM_NAME} (${ZONE})"
          echo "🐘 PostgreSQL     : v${PG_VERSION}"
          echo "🌐 Public IP      : ${PUBLIC_IP}"
          echo "🔌 Port           : 5432"
          echo "🗄️  Database       : ${DB_NAME} (empty, ready for your schema)"
          echo "👤 Superuser      : postgres"
          echo "👤 App user       : ${DB_USER}"
          echo "🔑 Password       : (stored in POSTGRES_PASSWORD secret)"
          echo ""
          echo "📋 Connection strings:"
          echo "   postgresql://postgres:<password>@${PUBLIC_IP}:5432/${DB_NAME}"
          echo "   postgresql://${DB_USER}:<password>@${PUBLIC_IP}:5432/${DB_NAME}"
          echo ""
          echo "🔗 pgAdmin settings:"
          echo "   Host     : ${PUBLIC_IP}"
          echo "   Port     : 5432"
          echo "   Database : ${DB_NAME}"
          echo "   Username : ${DB_USER}"
          echo ""
          echo "📋 Next steps (do these manually in pgAdmin or psql):"
          echo "   1. Connect using the credentials above"
          echo "   2. Create your schema:  CREATE SCHEMA myschema;"
          echo "   3. Create your tables and load your data"
          echo ""
          echo "⚠️  SECURITY REMINDER:"
          echo "   Port 5432 is currently open to: ${{ inputs.allowed_cidr }}"
          echo "   Restrict the 'allow-postgres-5432' firewall rule"
          echo "   to your specific IP once connectivity is confirmed."
          echo "=============================================="