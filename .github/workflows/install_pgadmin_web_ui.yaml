# ============================================================
# Workflow 3: Install pgAdmin 4 Web UI on a GCP VM
# ============================================================
# Purpose   : Installs pgAdmin 4 in server mode on the same
#             VM running PostgreSQL. Accessible via browser at
#             http://<VM-PUBLIC-IP>  (no local tools needed)
#
# Architecture:
#   Browser -> VM:80 (Nginx) -> pgAdmin4 (localhost:5050)
#                                   |
#                            PostgreSQL (localhost:5432)
#
# Pre-req   : Workflows 1 + 2 must have run successfully.
#
# Secrets required:
#   - GCP_PROJECT_ID
#   - GCP_WORKLOAD_IDENTITY_PROVIDER
#   - GCP_SERVICE_ACCOUNT
#   - POSTGRES_PASSWORD   (from Workflow 2)
#   - PGADMIN_EMAIL       (your pgAdmin login email)
#   - PGADMIN_PASSWORD    (your pgAdmin login password)
# ============================================================

name: "Install pgAdmin 4 Web UI on GCP VM"

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: "VM instance name (from Workflow 1 output)"
        required: true
        default: "postgres-vm"
        type: string
      zone:
        description: "GCP zone where the VM is running"
        required: true
        default: "us-central1-a"
        type: choice
        options:
          - us-central1-a
          - us-central1-b
          - us-east1-b
          - us-east1-c
          - us-west1-a
          - europe-west1-b
          - europe-west2-a
          - asia-east1-a
          - asia-southeast1-a
      pgadmin_port:
        description: "Internal port pgAdmin listens on (Nginx proxies 80 to this)"
        required: true
        default: "5050"
        type: choice
        options:
          - "5050"
          - "5051"
          - "8080"
      db_name:
        description: "Database name to pre-register in pgAdmin"
        required: true
        default: "appdb"
        type: string
      db_user:
        description: "Database user for pgAdmin server registration"
        required: true
        default: "appuser"
        type: string

jobs:
  install-pgadmin:
    name: "pgAdmin 4 -> ${{ inputs.vm_name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"

      # --------------------------------------------------------
      # Pre-flight
      # --------------------------------------------------------
      - name: Verify Target VM is Running
        run: |
          STATUS=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(status)' 2>/dev/null || echo "NOT_FOUND")
          if [[ "$STATUS" != "RUNNING" ]]; then
            echo "VM is $STATUS — must be RUNNING. Run Workflow 1 first."
            exit 1
          fi
          echo "VM ${{ inputs.vm_name }} is RUNNING"

      # --------------------------------------------------------
      # Firewall: open port 80
      # --------------------------------------------------------
      - name: Open Port 80 in Firewall
        run: |
          RULE_NAME="allow-http-80"
          if gcloud compute firewall-rules describe ${RULE_NAME} --quiet 2>/dev/null; then
            echo "Firewall rule ${RULE_NAME} already exists, skipping."
          else
            gcloud compute firewall-rules create ${RULE_NAME} \
              --allow tcp:80 \
              --target-tags pgadmin-server \
              --source-ranges 0.0.0.0/0 \
              --description "Allow HTTP access to pgAdmin web UI"
            echo "Port 80 opened"
          fi

          EXISTING_TAGS=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(tags.items)')
          if echo "$EXISTING_TAGS" | grep -q "pgadmin-server"; then
            echo "pgadmin-server tag already present"
          else
            gcloud compute instances add-tags ${{ inputs.vm_name }} \
              --zone ${{ inputs.zone }} \
              --tags pgadmin-server
            echo "pgadmin-server tag added"
          fi

      # --------------------------------------------------------
      # Install pgAdmin 4
      # --------------------------------------------------------
      - name: Install pgAdmin 4
        run: |
          PGADMIN_EMAIL="${{ secrets.PGADMIN_EMAIL }}"
          PGADMIN_PASSWORD="${{ secrets.PGADMIN_PASSWORD }}"

          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e
              echo 'Adding pgAdmin 4 apt repository...'
              curl -fsSL https://www.pgadmin.org/static/packages_pgadmin_org.pub \
                | sudo gpg --batch --yes --no-tty --dearmor \
                -o /etc/apt/trusted.gpg.d/pgadmin.gpg
              sudo sh -c 'echo \"deb https://ftp.postgresql.org/pub/pgadmin/pgadmin4/apt/jammy pgadmin4 main\" > /etc/apt/sources.list.d/pgadmin4.list'
              sudo apt-get update -qq
              echo 'Installing pgadmin4-web...'
              sudo apt-get install -y pgadmin4-web
              echo 'Running pgAdmin setup...'
              sudo PGADMIN_SETUP_EMAIL='${PGADMIN_EMAIL}' PGADMIN_SETUP_PASSWORD='${PGADMIN_PASSWORD}' /usr/pgadmin4/bin/setup-web.sh --yes
              echo 'pgAdmin 4 installed'
            "
          echo "pgAdmin 4 installed successfully"

      # --------------------------------------------------------
      # Write nginx config locally then scp to VM
      # (completely avoids heredoc-inside-YAML issues)
      # --------------------------------------------------------
      - name: Write Nginx Config File
        run: |
          PGADMIN_PORT="${{ inputs.pgadmin_port }}"
          printf 'server {\n    listen 80;\n    server_name _;\n\n    location / {\n        proxy_pass http://127.0.0.1:%s/;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_read_timeout 300;\n        proxy_connect_timeout 300;\n    }\n}\n' "$PGADMIN_PORT" > /tmp/pgadmin_nginx.conf
          echo "Nginx config written:"
          cat /tmp/pgadmin_nginx.conf

      - name: Copy Nginx Config to VM
        run: |
          gcloud compute scp /tmp/pgadmin_nginx.conf ${{ inputs.vm_name }}:/tmp/pgadmin_nginx.conf \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap
          echo "Nginx config copied to VM"

      - name: Apply Nginx Config on VM
        run: |
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e
              sudo apt-get install -y nginx
              sudo mv /tmp/pgadmin_nginx.conf /etc/nginx/sites-available/pgadmin
              sudo ln -sf /etc/nginx/sites-available/pgadmin /etc/nginx/sites-enabled/pgadmin
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo nginx -t
              sudo systemctl enable nginx
              sudo systemctl restart nginx
              echo 'Nginx running'
            "
          echo "Nginx reverse proxy configured"

      # --------------------------------------------------------
      # Write servers.json and pgpass locally then scp to VM
      # --------------------------------------------------------
      - name: Write pgAdmin Server Registration Files
        run: |
          DB_NAME="${{ inputs.db_name }}"
          DB_USER="${{ inputs.db_user }}"
          DB_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"

          printf '{\n  "Servers": {\n    "1": {\n      "Name": "Local PostgreSQL",\n      "Group": "Servers",\n      "Host": "localhost",\n      "Port": 5432,\n      "MaintenanceDB": "%s",\n      "Username": "%s",\n      "SSLMode": "prefer",\n      "PassFile": "/var/lib/pgadmin4/pgpass"\n    }\n  }\n}\n' "$DB_NAME" "$DB_USER" > /tmp/servers.json

          printf 'localhost:5432:*:%s:%s\n' "$DB_USER" "$DB_PASSWORD" > /tmp/pgpass

          echo "Registration files written"
          cat /tmp/servers.json

      - name: Copy Registration Files to VM
        run: |
          gcloud compute scp /tmp/servers.json ${{ inputs.vm_name }}:/tmp/servers.json \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap
          gcloud compute scp /tmp/pgpass ${{ inputs.vm_name }}:/tmp/pgpass \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap
          echo "Registration files copied to VM"

      - name: Apply Registration Files on VM
        run: |
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              set -e
              sudo mkdir -p /var/lib/pgadmin4
              sudo mv /tmp/servers.json /var/lib/pgadmin4/servers.json
              sudo mv /tmp/pgpass /var/lib/pgadmin4/pgpass
              sudo chmod 600 /var/lib/pgadmin4/pgpass
              sudo chown www-data:www-data /var/lib/pgadmin4/pgpass /var/lib/pgadmin4/servers.json
              echo 'Server pre-registered in pgAdmin'
            "
          echo "PostgreSQL server pre-registered in pgAdmin"

      # --------------------------------------------------------
      # Smoke test
      # --------------------------------------------------------
      - name: Smoke Test pgAdmin
        run: |
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "
              sleep 3
              HTTP_CODE=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)
              echo \"pgAdmin HTTP response: \${HTTP_CODE}\"
              if [[ \"\${HTTP_CODE}\" == \"200\" || \"\${HTTP_CODE}\" == \"302\" ]]; then
                echo 'pgAdmin is responding correctly'
              else
                echo 'Unexpected response. Checking service status...'
                sudo systemctl status nginx --no-pager || true
                exit 1
              fi
            "
          echo "pgAdmin smoke test passed"

      # --------------------------------------------------------
      # Summary
      # --------------------------------------------------------
      - name: Print Access Summary
        run: |
          PUBLIC_IP=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(networkInterfaces[0].accessConfigs[0].natIP)')

          echo ""
          echo "=============================================="
          echo "PGADMIN 4 WEB UI READY"
          echo "=============================================="
          echo ""
          echo "Open in your browser:"
          echo "   http://${PUBLIC_IP}"
          echo ""
          echo "Login credentials:"
          echo "   Email    : (stored in PGADMIN_EMAIL secret)"
          echo "   Password : (stored in PGADMIN_PASSWORD secret)"
          echo ""
          echo "Pre-registered server:"
          echo "   Name     : Local PostgreSQL"
          echo "   Host     : localhost (same VM)"
          echo "   Database : ${{ inputs.db_name }}"
          echo "   User     : ${{ inputs.db_user }}"
          echo ""
          echo "Architecture:"
          echo "   Browser -> ${PUBLIC_IP}:80 (Nginx) -> pgAdmin4 (:${{ inputs.pgadmin_port }}) -> PostgreSQL (:5432)"
          echo ""
          echo "SECURITY REMINDERS:"
          echo "   Restrict port 80 firewall rule to your IP after confirming access"
          echo "   Consider adding HTTPS via certbot for production use"
          echo "=============================================="