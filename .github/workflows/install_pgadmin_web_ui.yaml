name: "Install pgAdmin 4 Web UI on GCP VM"

# ============================================================
# Pre-req: Workflows 1 + 2 completed. VM running with PostgreSQL.
#
# Also add these files to your repo under pgadmin-config/
#   config_local.py   - pgAdmin Python config
#   pgadmin4.service  - systemd unit file
#   pgadmin_nginx.conf - Nginx reverse proxy config
#   servers.json      - pre-registers Local PostgreSQL in pgAdmin
#
# Secrets needed:
#   GCP_PROJECT_ID / GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT
#   POSTGRES_PASSWORD / PGADMIN_EMAIL / PGADMIN_PASSWORD
# ============================================================

on:
  workflow_dispatch:
    inputs:
      vm_name:
        description: "VM instance name (from Workflow 1)"
        required: true
        default: "postgres-vm"
        type: string
      zone:
        description: "GCP zone"
        required: true
        default: "us-central1-a"
        type: choice
        options:
          - us-central1-a
          - us-central1-b
          - us-east1-b
          - us-east1-c
          - us-west1-a
          - europe-west1-b
          - europe-west2-a
          - asia-east1-a
          - asia-southeast1-a
      db_name:
        description: "Database name (must match servers.json MaintenanceDB)"
        required: true
        default: "appdb"
        type: string
      db_user:
        description: "Database user (must match servers.json Username)"
        required: true
        default: "appuser"
        type: string

jobs:
  install-pgadmin:
    name: "pgAdmin 4 -> ${{ inputs.vm_name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"

      # --------------------------------------------------------
      # Pre-flight
      # --------------------------------------------------------
      - name: Verify Target VM is Running
        run: |
          STATUS=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(status)' 2>/dev/null || echo "NOT_FOUND")
          if [[ "$STATUS" != "RUNNING" ]]; then
            echo "VM is $STATUS - must be RUNNING. Run Workflow 1 first."
            exit 1
          fi
          echo "VM ${{ inputs.vm_name }} is RUNNING"

      # --------------------------------------------------------
      # Firewall: open port 80
      # --------------------------------------------------------
      - name: Open Port 80 in Firewall
        run: |
          RULE_NAME="allow-http-80"
          if gcloud compute firewall-rules describe ${RULE_NAME} --quiet 2>/dev/null; then
            echo "Firewall rule ${RULE_NAME} already exists, skipping."
          else
            gcloud compute firewall-rules create ${RULE_NAME} \
              --allow tcp:80 \
              --target-tags pgadmin-server \
              --source-ranges 0.0.0.0/0 \
              --description "Allow HTTP access to pgAdmin web UI"
            echo "Port 80 opened"
          fi
          EXISTING_TAGS=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(tags.items)')
          if echo "$EXISTING_TAGS" | grep -q "pgadmin-server"; then
            echo "pgadmin-server tag already present"
          else
            gcloud compute instances add-tags ${{ inputs.vm_name }} \
              --zone ${{ inputs.zone }} \
              --tags pgadmin-server
            echo "pgadmin-server tag added"
          fi

      # --------------------------------------------------------
      # Install pgAdmin4-server package on VM
      # --------------------------------------------------------
      - name: Install pgAdmin4-server
        run: |
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "set -e &&
              echo 'Waiting for apt lock...' &&
              while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock 2>/dev/null; do
                echo 'apt is locked, waiting 10s...'
                sleep 10
              done &&
              curl -fsSL https://www.pgadmin.org/static/packages_pgadmin_org.pub |
                sudo gpg --batch --yes --no-tty --dearmor -o /etc/apt/trusted.gpg.d/pgadmin.gpg &&
              sudo sh -c 'echo \"deb https://ftp.postgresql.org/pub/pgadmin/pgadmin4/apt/jammy pgadmin4 main\" > /etc/apt/sources.list.d/pgadmin4.list' &&
              sudo apt-get update -qq &&
              sudo apt-get install -y pgadmin4-server &&
              sudo useradd -r -s /usr/sbin/nologin pgadmin 2>/dev/null || true &&
              sudo mkdir -p /var/lib/pgadmin4 /var/log/pgadmin4 &&
              sudo chown -R pgadmin:pgadmin /var/lib/pgadmin4 /var/log/pgadmin4 &&
              echo pgAdmin4-server installed"
          echo "pgAdmin4-server installed"

      # --------------------------------------------------------
      # Copy all config files from repo to VM via scp
      # --------------------------------------------------------
      - name: Copy Config Files to VM
        run: |
          for f in config_local.py pgadmin4.service pgadmin_nginx.conf servers.json; do
            gcloud compute scp pgadmin-config/$f ${{ inputs.vm_name }}:/tmp/$f \
              --zone ${{ inputs.zone }} \
              --tunnel-through-iap
            echo "Copied $f"
          done

      # --------------------------------------------------------
      # Write pgpass on runner (contains secret) then scp
      # --------------------------------------------------------
      - name: Write and Copy pgpass
        run: |
          echo "localhost:5432:*:${{ inputs.db_user }}:${{ secrets.POSTGRES_PASSWORD }}" > /tmp/pgpass
          chmod 600 /tmp/pgpass
          gcloud compute scp /tmp/pgpass ${{ inputs.vm_name }}:/tmp/pgpass \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap
          echo "pgpass copied"

      # --------------------------------------------------------
      # Initialise pgAdmin DB and create admin user
      # --------------------------------------------------------
      - name: Initialise pgAdmin Database
        run: |
          # Write a self-contained init script on the runner to avoid shell-escaping secrets
          cat > /tmp/pgadmin_init.sh << 'INITEOF'
          #!/bin/bash
          set -e
          EMAIL="$1"
          PASSWORD="$2"
          PYTHON=/usr/pgadmin4/venv/bin/python3
          SETUP=/usr/pgadmin4/web/setup.py

          echo "=== Step 1: setup-db ==="
          sudo -u pgadmin HOME=/var/lib/pgadmin4 \
            PGADMIN_SETUP_EMAIL="$EMAIL" \
            PGADMIN_SETUP_PASSWORD="$PASSWORD" \
            "$PYTHON" "$SETUP" setup-db
          echo "Database initialised"

          echo "=== add-user flags ==="
          "$PYTHON" "$SETUP" add-user --help 2>&1 || true
          echo "======================"

          echo "=== Step 2: add-user ==="
          sudo -u pgadmin HOME=/var/lib/pgadmin4 "$PYTHON" "$SETUP" add-user \
            --admin "$EMAIL" "$PASSWORD"
          echo "pgAdmin DB initialised"
          INITEOF
          chmod +x /tmp/pgadmin_init.sh

          # Copy init script and config to the VM
          gcloud compute scp /tmp/pgadmin_init.sh ${{ inputs.vm_name }}:/tmp/pgadmin_init.sh \
            --zone ${{ inputs.zone }} --tunnel-through-iap
          gcloud compute scp pgadmin-config/config_local.py ${{ inputs.vm_name }}:/tmp/config_local.py \
            --zone ${{ inputs.zone }} --tunnel-through-iap

          # Run it — secrets passed as positional args, never appear in the script file
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "set -e &&
              sudo cp /tmp/config_local.py /usr/pgadmin4/web/config_local.py &&
              bash /tmp/pgadmin_init.sh '${{ secrets.PGADMIN_EMAIL }}' '${{ secrets.PGADMIN_PASSWORD }}' &&
              rm /tmp/pgadmin_init.sh"
          echo "pgAdmin database initialised"

      # --------------------------------------------------------
      # Install and start pgAdmin4 as systemd service
      # --------------------------------------------------------
      - name: Start pgAdmin4 Service
        run: |
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "set -e &&
              sudo mv /tmp/pgadmin4.service /etc/systemd/system/pgadmin4.service &&
              sudo systemctl daemon-reload &&
              sudo systemctl enable pgadmin4 &&
              sudo systemctl start pgadmin4 &&
              sleep 4 &&
              sudo systemctl status pgadmin4 --no-pager &&
              sudo mv /tmp/servers.json /var/lib/pgadmin4/servers.json &&
              sudo mv /tmp/pgpass /var/lib/pgadmin4/pgpass &&
              sudo chmod 600 /var/lib/pgadmin4/pgpass &&
              sudo chown pgadmin:pgadmin /var/lib/pgadmin4/servers.json /var/lib/pgadmin4/pgpass &&
              echo pgAdmin4 service running"
          echo "pgAdmin4 service started"

      # --------------------------------------------------------
      # Install Nginx and apply reverse proxy config
      # --------------------------------------------------------
      - name: Start Nginx
        run: |
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "set -e &&
              echo 'Waiting for apt lock to be released...' &&
              while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock 2>/dev/null; do
                echo 'apt is locked by another process, waiting 10s...'
                sleep 10
              done &&
              echo 'apt lock released' &&
              sudo systemctl stop apache2 2>/dev/null || true &&
              sudo systemctl disable apache2 2>/dev/null || true &&
              sudo apt-get install -y nginx &&
              sudo mv /tmp/pgadmin_nginx.conf /etc/nginx/sites-available/pgadmin &&
              sudo ln -sf /etc/nginx/sites-available/pgadmin /etc/nginx/sites-enabled/pgadmin &&
              sudo rm -f /etc/nginx/sites-enabled/default &&
              sudo nginx -t &&
              sudo systemctl enable nginx &&
              sudo systemctl restart nginx &&
              echo Nginx running"
          echo "Nginx started"

      # --------------------------------------------------------
      # Smoke test
      # --------------------------------------------------------
      - name: Smoke Test pgAdmin
        run: |
          gcloud compute ssh ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --tunnel-through-iap \
            --command "sleep 5 &&
              HTTP_CODE=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost/) &&
              echo HTTP response: \$HTTP_CODE &&
              if [[ \"\$HTTP_CODE\" == \"200\" || \"\$HTTP_CODE\" == \"302\" ]]; then
                echo pgAdmin is responding correctly
              else
                sudo journalctl -u pgadmin4 --no-pager -n 30 || true
                sudo tail -20 /var/log/pgadmin4/pgadmin4.log || true
                exit 1
              fi"
          echo "pgAdmin smoke test passed"

      # --------------------------------------------------------
      # Summary
      # --------------------------------------------------------
      - name: Print Access Summary
        run: |
          PUBLIC_IP=$(gcloud compute instances describe ${{ inputs.vm_name }} \
            --zone ${{ inputs.zone }} \
            --format 'value(networkInterfaces[0].accessConfigs[0].natIP)')
          echo ""
          echo "=============================================="
          echo "PGADMIN 4 WEB UI READY"
          echo "=============================================="
          echo "Open in your browser : http://${PUBLIC_IP}"
          echo "Login email          : (PGADMIN_EMAIL secret)"
          echo "Login password       : (PGADMIN_PASSWORD secret)"
          echo "Pre-registered DB    : ${{ inputs.db_name }} as ${{ inputs.db_user }}"
          echo "Architecture         : Browser -> ${PUBLIC_IP}:80 -> pgAdmin4 (:5050) -> PostgreSQL (:5432)"
          echo "REMINDER             : Restrict allow-http-80 firewall rule to your IP"
          echo "=============================================="