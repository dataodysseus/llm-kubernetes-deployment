# ============================================================
# Deploy Databricks Workspace on GCP via Terraform
# ============================================================
# Reuses the same WIF auth pattern as your deploy_gcp_vm workflow.
# The service account runs Terraform AND authenticates to the
# Databricks account-level API via Google-issued OIDC tokens.
#
# Required GitHub Secrets (same as your VM workflow):
#   GCP_PROJECT_ID                  — genai-model-dev-deploy
#   GCP_WORKLOAD_IDENTITY_PROVIDER  — your existing WIF provider
#   GCP_SERVICE_ACCOUNT             — my-service-account@genai-model-dev-deploy.iam.gserviceaccount.com
#   DATABRICKS_ACCOUNT_ID           — bbd2dc60-e52e-4335-a663-156574f5ed23
#
# One-time setup needed (see README):
#   1. Add GCP_SERVICE_ACCOUNT as Databricks Account Admin
#   2. Grant GCP_SERVICE_ACCOUNT the extra IAM roles below
# ============================================================

name: "Deploy Databricks on GCP"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

      action:
        description: "Terraform action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan        # Safe — just shows what will change
          - apply       # Creates/updates infrastructure
          - destroy     # Tears everything down

      workspace_name:
        description: "Databricks workspace name (leave blank to use default)"
        required: false
        default: ""
        type: string

jobs:
  terraform:
    name: "Terraform ${{ inputs.action }} (${{ inputs.environment }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for WIF OIDC token

    defaults:
      run:
        working-directory: databricks-gcp-deployment   # Run from repo root

    steps:
      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Auth — identical pattern to your VM workflow
      # --------------------------------------------------------
      - name: Authenticate with Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id:                  "${{ secrets.GCP_PROJECT_ID }}"
          workload_identity_provider:  "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account:             "${{ secrets.GCP_SERVICE_ACCOUNT }}"
          # This creates ADC credentials AND a service account token
          # that the Databricks provider can use for OIDC auth
          create_credentials_file:     true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: "${{ secrets.GCP_PROJECT_ID }}"

      # --------------------------------------------------------
      # 3. Install Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      # --------------------------------------------------------
      # 4. Set Databricks auth env vars
      #    The Databricks provider picks these up automatically
      # --------------------------------------------------------
      - name: Configure Databricks auth environment
        run: |
          echo "DATABRICKS_HOST=https://accounts.gcp.databricks.com" >> $GITHUB_ENV
          echo "DATABRICKS_ACCOUNT_ID=${{ secrets.DATABRICKS_ACCOUNT_ID }}" >> $GITHUB_ENV
          # Tell Databricks provider to use the service account identity
          # GOOGLE_CREDENTIALS is already set by the auth step above
          echo "DATABRICKS_GOOGLE_SERVICE_ACCOUNT=${{ secrets.GCP_SERVICE_ACCOUNT }}" >> $GITHUB_ENV

      # --------------------------------------------------------
      # 5. Resolve workspace name
      # --------------------------------------------------------
      - name: Resolve workspace name
        id: vars
        run: |
          ENV="${{ inputs.environment }}"
          CUSTOM="${{ inputs.workspace_name }}"
          if [[ -n "$CUSTOM" ]]; then
            echo "workspace_name=$CUSTOM" >> $GITHUB_OUTPUT
          else
            echo "workspace_name=databricks-gcp-${ENV}" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------------
      # 6. Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        run: terraform init -upgrade


      - name: Import existing resources (if any)
        working-directory: databricks-gcp-deployment
        run: |
          import_if_exists() {
            terraform import "$1" "$2" 2>/dev/null && echo "Imported $1" || echo "Skipped $1 (not found)"
          }
          import_if_exists "module.gcp_iam.google_service_account.gke_node" \
            "projects/genai-model-dev-deploy/serviceAccounts/databricks-gke-node-dev@genai-model-dev-deploy.iam.gserviceaccount.com"
          import_if_exists "module.gcp_iam.google_service_account.storage" \
            "projects/genai-model-dev-deploy/serviceAccounts/databricks-storage-dev@genai-model-dev-deploy.iam.gserviceaccount.com"
          import_if_exists "module.gcp_iam.google_storage_bucket.dbfs_root" \
            "databricks-dbfs-genai-model-dev-deploy-dev"
          import_if_exists "module.gcp_networking.google_compute_network.databricks_vpc" \
            "projects/genai-model-dev-deploy/global/networks/databricks-vpc-dev"
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}

      # --------------------------------------------------------
      # 7. Terraform Plan (always runs first)
      # --------------------------------------------------------
      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="environments/${{ inputs.environment }}/${{ inputs.environment }}.tfvars" \
            -var="workspace_name=${{ steps.vars.outputs.workspace_name }}" \
            -out=tfplan
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_gcp_project_id:        ${{ secrets.GCP_PROJECT_ID }}

      # --------------------------------------------------------
      # 8. Terraform Apply (only when action = apply)
      # --------------------------------------------------------
      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_gcp_project_id:        ${{ secrets.GCP_PROJECT_ID }}

      # --------------------------------------------------------
      # 9. Terraform Destroy (only when action = destroy)
      # --------------------------------------------------------
      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var-file="environments/${{ inputs.environment }}/${{ inputs.environment }}.tfvars"
        env:
          TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_gcp_project_id:        ${{ secrets.GCP_PROJECT_ID }}

      # --------------------------------------------------------
      # 10. Print workspace URL on success
      # --------------------------------------------------------
      - name: Print Workspace URL
        if: inputs.action == 'apply'
        run: |
          echo ""
          echo "=============================================="
          echo "🎉 DATABRICKS WORKSPACE DEPLOYED"
          echo "=============================================="
          terraform output workspace_url || echo "URL will be available after full provisioning"
          echo "=============================================="
