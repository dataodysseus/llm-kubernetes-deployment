<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retail Intelligence · DB Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0f0f;
    --surface:  #141818;
    --border:   #1e2424;
    --border2:  #2a3333;
    --text:     #c8d4d4;
    --muted:    #5a6e6e;
    --accent:   #00e5b4;
    --accent2:  #ff6b35;
    --user-bg:  #0f1e1a;
    --ai-bg:    #111515;
    --tool-bg:  #0a1510;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
    --font-display: 'Bebas Neue', sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); }

  /* ── Layout ── */
  .app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; max-width: 1100px; margin: 0 auto; }

  /* ── Header ── */
  header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 16px;
  }
  header h1 {
    font-family: var(--font-display);
    font-size: 2rem; letter-spacing: 0.08em;
    color: var(--accent);
    line-height: 1;
  }
  header .sub {
    font-family: var(--font-mono);
    font-size: 0.65rem; color: var(--muted);
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-left: auto;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
  }
  .status-label {
    font-family: var(--font-mono); font-size: 0.6rem;
    color: var(--muted); letter-spacing: 0.1em;
  }

  /* ── Suggestions ── */
  .suggestions {
    padding: 12px 28px 0;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .suggestions button {
    font-family: var(--font-mono); font-size: 0.65rem;
    padding: 5px 12px; border-radius: 2px;
    border: 1px solid var(--border2);
    background: transparent; color: var(--muted);
    cursor: pointer; letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .suggestions button:hover {
    border-color: var(--accent); color: var(--accent);
    background: rgba(0,229,180,0.05);
  }

  /* ── Chat area ── */
  .chat {
    overflow-y: auto; padding: 24px 28px;
    display: flex; flex-direction: column; gap: 20px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-track { background: transparent; }
  .chat::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── Empty state ── */
  .empty-state {
    margin: auto; text-align: center; opacity: 0.4;
  }
  .empty-state .big {
    font-family: var(--font-display);
    font-size: 4rem; color: var(--accent);
    letter-spacing: 0.1em; line-height: 1;
  }
  .empty-state p {
    font-family: var(--font-mono); font-size: 0.7rem;
    color: var(--muted); margin-top: 8px;
    letter-spacing: 0.08em;
  }

  /* ── Messages ── */
  .msg { display: flex; flex-direction: column; gap: 6px; animation: fadein 0.2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .msg-header {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-mono); font-size: 0.6rem;
    color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .msg-header .tag {
    padding: 2px 8px; border-radius: 1px;
    font-size: 0.58rem; font-weight: 500;
  }
  .tag-user { background: rgba(255,107,53,0.15); color: var(--accent2); border: 1px solid rgba(255,107,53,0.3); }
  .tag-ai   { background: rgba(0,229,180,0.1);   color: var(--accent);  border: 1px solid rgba(0,229,180,0.25); }

  .msg-body {
    padding: 14px 18px; border-radius: 3px;
    line-height: 1.7; font-size: 0.88rem;
    border-left: 2px solid transparent;
  }
  .msg.user .msg-body { background: var(--user-bg); border-color: var(--accent2); }
  .msg.ai   .msg-body { background: var(--ai-bg);   border-color: var(--accent); }
  .msg-body p { margin-bottom: 8px; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body strong { color: var(--accent); font-weight: 500; }
  .msg-body code {
    font-family: var(--font-mono); font-size: 0.78rem;
    background: rgba(0,229,180,0.07); padding: 1px 5px;
    border-radius: 2px; color: var(--accent);
  }

  /* ── Tool calls ── */
  .tool-calls { display: flex; flex-direction: column; gap: 4px; }
  .tool-call {
    font-family: var(--font-mono); font-size: 0.63rem;
    background: var(--tool-bg); border: 1px solid #0d2018;
    padding: 6px 12px; border-radius: 2px;
    color: #3a8a6a; letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 8px;
  }
  .tool-call::before { content: '⚡'; font-size: 0.7rem; }
  .tool-name { color: var(--accent); }

  /* ── Thinking indicator ── */
  .thinking {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 0.65rem;
    color: var(--muted); letter-spacing: 0.08em;
    padding: 10px 0;
  }
  .dots span {
    display: inline-block; width: 5px; height: 5px;
    border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite;
    margin-right: 3px;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Input area ── */
  .input-area {
    padding: 16px 28px 24px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .input-row {
    display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1; background: var(--surface);
    border: 1px solid var(--border2); border-radius: 3px;
    color: var(--text); font-family: var(--font-sans);
    font-size: 0.88rem; padding: 12px 16px;
    resize: none; min-height: 48px; max-height: 160px;
    line-height: 1.5; outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  button.send {
    background: var(--accent); color: #000;
    border: none; border-radius: 3px;
    width: 48px; height: 48px; cursor: pointer;
    font-size: 1.1rem; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
    transition: all 0.15s; font-weight: 700;
  }
  button.send:hover { background: #00ffcc; transform: scale(1.04); }
  button.send:disabled { background: var(--border2); color: var(--muted); transform: none; cursor: not-allowed; }

  .input-hint {
    font-family: var(--font-mono); font-size: 0.58rem;
    color: var(--muted); margin-top: 6px; letter-spacing: 0.06em;
  }

  /* ── Scrollbar ── */
  * { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>RETAIL INTEL</h1>
    <span class="sub">PostgreSQL · pgvector · MCP</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <span class="status-label">MCP CONNECTED</span>
      <div class="status-dot"></div>
    </div>
  </header>

  <div class="suggestions" id="suggestions">
    <button onclick="ask('Which products are currently out of stock?')">Out of stock alerts</button>
    <button onclick="ask('Which active promotions have products running low?')">Promo stock risk</button>
    <button onclick="ask('Which suppliers are a single point of failure for critical materials?')">Supplier risk</button>
    <button onclick="ask('What promotions are currently active?')">Active promotions</button>
    <button onclick="ask('Show inventory for the Northeast warehouse')">NE warehouse stock</button>
  </div>

  <div class="chat" id="chat">
    <div class="empty-state" id="empty">
      <div class="big">ASK</div>
      <p>Query your retail database in natural language</p>
      <p style="margin-top:4px">inventory · suppliers · promotions · products</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="Ask anything about your retail data..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send" id="sendBtn" onclick="sendMessage()">↑</button>
    </div>
    <div class="input-hint">Enter to send · Shift+Enter for new line</div>
  </div>

</div>

<script>
  const chat    = document.getElementById('chat');
  const input   = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const empty   = document.getElementById('empty');
  let history   = [];
  let busy      = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function ask(text) {
    input.value = text;
    autoResize(input);
    sendMessage();
  }

  function addMessage(role, content, toolCalls = []) {
    if (empty) empty.style.display = 'none';

    const div = document.createElement('div');
    div.className = `msg ${role}`;

    const tag = role === 'user' ? 'YOU' : 'RETAIL INTEL';
    const tagClass = role === 'user' ? 'tag-user' : 'tag-ai';
    const time = new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});

    div.innerHTML = `
      <div class="msg-header">
        <span class="tag ${tagClass}">${tag}</span>
        <span>${time}</span>
      </div>
      ${toolCalls.length > 0 ? `
        <div class="tool-calls">
          ${toolCalls.map(t => `
            <div class="tool-call">
              <span class="tool-name">${t.tool}</span>
              <span style="color:var(--muted)">${JSON.stringify(t.input).substring(0, 80)}${JSON.stringify(t.input).length > 80 ? '...' : ''}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <div class="msg-body">${formatContent(content)}</div>
    `;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function formatContent(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>')
      .replace(/^/, '<p>').replace(/$/, '</p>');
  }

  function addThinking() {
    const div = document.createElement('div');
    div.className = 'thinking';
    div.id = 'thinking';
    div.innerHTML = `
      <div class="dots"><span></span><span></span><span></span></div>
      <span>Querying database</span>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeThinking() {
    const t = document.getElementById('thinking');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    addThinking();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history.slice(-10) }),
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      removeThinking();
      addMessage('ai', data.reply, data.tool_calls || []);
      history.push({ role: 'assistant', content: data.reply });

    } catch (err) {
      removeThinking();
      addMessage('ai', `Connection error: ${err.message}. Make sure the backend is running.`);
    }

    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
